services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket_service
      POSTGRES_PASSWORD: ticket_service
      POSTGRES_DB: ticket_service
    ports:
      - "5433:5432"
    volumes:
      - ticket_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  ticket-service-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/ticket-service/internal/infra/postgres/migrations:/migrations:ro
    environment:
      DATABASE_URL: postgres://ticket_service:ticket_service@postgres:5432/ticket_service?sslmode=disable
    entrypoint: ["sh", "-c", "for f in /migrations/*.sql; do echo \"applying $$f\"; psql \"$$DATABASE_URL\" -f \"$$f\" || exit 1; done"]

  employees-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: employees_service
      POSTGRES_PASSWORD: employees_service
      POSTGRES_DB: employees_service
    ports:
      - "5434:5432"
    volumes:
      - employees_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  employees-service-migrate:
    image: postgres:16-alpine
    depends_on:
      employees-postgres:
        condition: service_healthy
    volumes:
      - ./services/employees-service/internal/infra/postgres/migrations:/migrations:ro
    environment:
      DATABASE_URL: postgres://employees_service:employees_service@employees-postgres:5432/employees_service?sslmode=disable
    entrypoint: ["sh", "-c", "for f in /migrations/*.sql; do echo \"applying $$f\"; psql \"$$DATABASE_URL\" -f \"$$f\" || exit 1; done"]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["sh", "-c", "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do echo waiting for kafka; sleep 2; done && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic employees.events --partitions 1 --replication-factor 1"]

  employees-service:
    build:
      context: ./services/employees-service
    depends_on:
      employees-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://employees_service:employees_service@employees-postgres:5432/employees_service?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PORT: "8081"
    ports:
      - "18081:8081"

  ticket-service:
    build:
      context: ./services/ticket-service
    depends_on:
      ticket-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ticket_service:ticket_service@postgres:5432/ticket_service?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PORT: "8080"
    ports:
      - "18080:8080"

volumes:
  ticket_service_postgres_data:
  employees_service_postgres_data:
