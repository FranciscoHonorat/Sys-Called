x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-migrate: &migrate
  image: postgres:16-alpine
  logging: *default-logging
  entrypoint: ["sh", "-c", "for f in /migrations/*.sql; do echo \"applying $$f\"; psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -q -f \"$$f\" || exit 1; done"]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${TICKET_DB_USER:?defina TICKET_DB_USER no .env}
      POSTGRES_PASSWORD: ${TICKET_DB_PASSWORD:?defina TICKET_DB_PASSWORD no .env}
      POSTGRES_DB: ${TICKET_DB_NAME:?defina TICKET_DB_NAME no .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ticket_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ticket-service-migrate:
    <<: *migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/ticket-service/internal/adapters/out/postgres/migrations:/migrations:ro
    environment:
      DATABASE_URL: postgres://${TICKET_DB_USER}:${TICKET_DB_PASSWORD}@postgres:5432/${TICKET_DB_NAME}?sslmode=disable

  employees-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${EMPLOYEES_DB_USER:?defina EMPLOYEES_DB_USER no .env}
      POSTGRES_PASSWORD: ${EMPLOYEES_DB_PASSWORD:?defina EMPLOYEES_DB_PASSWORD no .env}
      POSTGRES_DB: ${EMPLOYEES_DB_NAME:?defina EMPLOYEES_DB_NAME no .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - employees_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  employees-service-migrate:
    <<: *migrate
    depends_on:
      employees-postgres:
        condition: service_healthy
    volumes:
      - ./services/employees-service/internal/adapters/out/postgres/migrations:/migrations:ro
    environment:
      DATABASE_URL: postgres://${EMPLOYEES_DB_USER}:${EMPLOYEES_DB_PASSWORD}@employees-postgres:5432/${EMPLOYEES_DB_NAME}?sslmode=disable

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?defina KAFKA_CLUSTER_ID no .env}
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "employees.events", "--partitions", "1", "--replication-factor", "1"]

  employees-service:
    build:
      context: ./services/employees-service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      employees-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${EMPLOYEES_DB_USER}:${EMPLOYEES_DB_PASSWORD}@employees-postgres:5432/${EMPLOYEES_DB_NAME}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PORT: "8081"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  ticket-service:
    build:
      context: ./services/ticket-service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      ticket-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      employees-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${TICKET_DB_USER}:${TICKET_DB_PASSWORD}@postgres:5432/${TICKET_DB_NAME}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PORT: "8080"
      EMPLOYEES_JWKS_URL: http://employees-service:8081/.well-known/jwks.json
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      employees-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ticket_service_postgres_data:
  employees_service_postgres_data:
