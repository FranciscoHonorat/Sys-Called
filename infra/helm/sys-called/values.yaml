imagePullPolicy: IfNotPresent

images:
  employeesService:
    repository: sys-called/employees-service
    tag: latest
  ticketService:
    repository: sys-called/ticket-service
    tag: latest
  frontend:
    repository: sys-called/frontend
    tag: latest
  postgres:
    repository: postgres
    tag: 16-alpine
  kafka:
    repository: apache/kafka
    tag: 3.8.0

storageClass: ""

jwtPrivateKey: ""

databases:
  ticket:
    name: ticket_service
    user: ticket_service
    password: ""
    storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  employees:
    name: employees_service
    user: employees_service
    password: ""
    storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

kafka:
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  topic: employees.events
  heapOpts: "-Xms256m -Xmx512m"
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

employeesService:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

ticketService:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

frontend:
  replicas: 1
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

ingress:
  enabled: false
  className: ""
  host: sys-called.local
