{{- range $db, $database := .Values.databases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db }}-postgres
  labels:
    {{- include "sys-called.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $db }}-postgres
spec:
  clusterIP: None
  selector:
    {{- include "sys-called.selector" (dict "root" $ "name" (printf "%s-postgres" $db)) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $db }}-postgres
  labels:
    {{- include "sys-called.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $db }}-postgres
spec:
  serviceName: {{ $db }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "sys-called.selector" (dict "root" $ "name" (printf "%s-postgres" $db)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sys-called.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $db }}-postgres
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ include "sys-called.image" $.Values.images.postgres }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ $database.user }}
            - name: POSTGRES_DB
              value: {{ $database.name }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sys-called.secretName" $ }}
                  key: {{ $db }}-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml $database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $.Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $database.storage }}
{{- end }}
