apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "sys-called.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "sys-called.selector" (dict "root" . "name" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "sys-called.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "sys-called.selector" (dict "root" . "name" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sys-called.labels" . | nindent 8 }}
        app.kubernetes.io/name: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: {{ include "sys-called.image" .Values.images.frontend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
