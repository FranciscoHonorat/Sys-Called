apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sys-called.secretName" . }}
  labels:
    {{- include "sys-called.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $db, $database := .Values.databases }}
  {{ $db }}-db-password: {{ include "sys-called.secretValue" (dict "root" $ "key" (printf "%s-db-password" $db) "value" $database.password "generate" (randAlphaNum 32)) }}
  {{- end }}
  jwt-private-key: {{ include "sys-called.secretValue" (dict "root" . "key" "jwt-private-key" "value" .Values.jwtPrivateKey "generate" (genPrivateKey "ed25519")) }}
